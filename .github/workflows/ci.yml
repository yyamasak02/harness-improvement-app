name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: フロントのビルドとテスト（go:embed が dist を要求するため先に実行）
        run: cd frontend && npm ci && npm run build && npm test
      - name: Go の静的解析とテスト
        run: go vet ./... && go test ./...
      - name: カバレッジ基準（70%）
        run: bash scripts/coverage.sh
  dmg-smoke:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci
      - name: make dmg（署名・公証なし）
        run: make dmg
      - name: 成果物の確認（universal バイナリと dmg）
        run: |
          ls -la build/bin
          file build/bin/harness-app.app/Contents/MacOS/harness-app
          hdiutil verify build/bin/harness-app.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: harness-app-dmg
          path: build/bin/harness-app.dmg
