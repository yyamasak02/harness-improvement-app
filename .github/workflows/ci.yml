name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint:
    name: lint（pre-commit・ルール検査）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: cd frontend && npm ci
      - run: pip install pre-commit
      - name: pre-commit（全ファイル）
        run: pre-commit run --all-files --show-diff-on-failure
      - name: 品質ゲート自体のテスト
        run: bash scripts/selftest-checks.sh
      - name: 安全装置（フック・権限）の実環境診断
        run: bash scripts/check-harness.sh

  test-go:
    name: test-go（race・カバレッジ基準）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: カバレッジ基準（collector・digest・masking・applier・runner が 70% 以上）
        run: bash scripts/coverage.sh

  test-frontend:
    name: test-frontend（build・カバレッジ基準）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - run: cd frontend && npm run test:coverage

  pr-policy:
    name: pr-policy（タイトル・issue 参照・CHANGELOG・テスト更新）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: タイトルが Conventional 形式であること
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|refactor|test|docs|chore|ci)(\([a-zA-Z0-9_,./-]+\))?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "PR タイトルは '<feat|fix|refactor|test|docs|chore|ci>(scope)?: 要約' の形式にしてください: $TITLE"
            exit 1
          fi
      - name: 関連 issue の参照（Closes/Refs #N または [no-issue]）
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash scripts/check-pr-issue-link.sh
      - name: 個人情報・秘密・作者メールの混入検査（差分・コミットメッセージ・PR タイトル/本文）
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE"
          printf '%s\n%s\n' "$PR_TITLE" "$PR_BODY" | bash scripts/check-privacy.sh text
          bash scripts/check-privacy.sh range "origin/$BASE"
      - name: 境界ファイルの変更に、第一承認者（別エージェント）の評価の記録があること
        env:
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE"
          bash scripts/check-approvals.sh range "origin/$BASE"
      - name: feat/fix は CHANGELOG を更新する
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE"
          bash scripts/check-changelog.sh "origin/$BASE"
      - name: 実装を変えたらテストも変える
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE"
          bash scripts/check-tests-changed.sh range "origin/$BASE"

  test-macos:
    name: test-macos（darwin 上の Go テスト）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -count=1 ./...

  test-windows:
    name: test-windows（Go テスト・フロントのビルドとテスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build && npm test
      - run: go vet ./...
      - run: go test -count=1 ./...

  windows-build-smoke:
    name: windows-build-smoke（exe・インストーラ）
    runs-on: windows-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci
      - run: choco install nsis -y --no-progress
      - name: wails build（exe + NSIS インストーラ。署名なし）
        shell: bash   # 複数コマンドは bash で。pwsh は最後のコマンドの終了コードしか見ない
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -platform windows/amd64 -clean -nsis
          ls -la build/bin
      - uses: actions/upload-artifact@v4
        with:
          name: harness-app-windows
          path: build/bin/*installer.exe

  wailsjs-sync:
    name: wailsjs-sync（frontend/wailsjs が再生成と一致するか）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci && npm run build
      - name: wails generate module して差分を検査
        run: |
          wails generate module -tags webkit2_41
          if [ -n "$(git status --porcelain -- frontend/wailsjs)" ]; then
            echo "::error::frontend/wailsjs が wails generate module の出力と一致しません。再生成してコミットしてください。"
            git status --porcelain -- frontend/wailsjs
            git diff -- frontend/wailsjs | head -100
            git diff -- frontend/wailsjs > "$RUNNER_TEMP/wailsjs.diff"
            exit 1
          fi
      - name: 失敗時に再生成結果をアップロード
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wailsjs-regenerated
          path: |
            frontend/wailsjs
            ${{ runner.temp }}/wailsjs.diff

  e2e:
    name: e2e（Playwright・小さいウィンドウでのレイアウト）
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: ブラウザ（chromium）を取得
        run: cd frontend && npx playwright install --with-deps chromium
      - name: E2E（vite のビルド結果を mockApi で動かす。実 ~/.claude・実 claude は使わない）
        run: cd frontend && npm run e2e

  ux-metrics:
    name: ux-metrics（ユーザー体験の計測・予算超過で失敗）
    runs-on: ubuntu-latest
    needs: [test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - name: ブラウザ（chromium）を取得
        run: cd frontend && npx playwright install --with-deps chromium
      - name: UX 指標を計測（mockApi・合成データ。結果はジョブサマリーに出る。docs/ux-metrics.md）
        run: cd frontend && npm run e2e:ux
      - name: 結果 JSON をアーティファクトに保存（推移の確認用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-metrics
          path: frontend/ux-metrics-results/
          if-no-files-found: warn

  linux-build-smoke:
    name: linux-build-smoke（WSL・Linux 用バイナリ）
    runs-on: ubuntu-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci
      - name: make linux
        run: make linux
      - name: 成果物の確認
        run: |
          ls -la build/bin
          test -x build/bin/harness-app
      - name: .deb を作って中身を確認
        run: |
          bash scripts/build-deb.sh build/bin
          dpkg-deb --info build/bin/harness-app_*_amd64.deb | grep -q 'Depends: libgtk-3-0, libwebkit2gtk-4.1-0'
          dpkg-deb --contents build/bin/harness-app_*_amd64.deb | grep -q ' ./usr/bin/harness-app$'
      - name: .deb のバージョン順序（rc 間・正式版）
        run: |
          set -e
          dpkg --compare-versions 0.1.0~rc.3 lt 0.1.0~rc.4
          dpkg --compare-versions 0.1.0~rc.4 lt 0.1.0
          dpkg --compare-versions 0.1.0~rc.10 gt 0.1.0~rc.9
          dpkg --compare-versions 0.1.0 lt 0.1.1~rc.1
          # 現行の wails.json のバージョンが、1 つ前の rc より新しい（~ 形式に変換されている）
          cur=$(dpkg-deb --field build/bin/harness-app_*_amd64.deb Version)
          echo "現行の deb バージョン: $cur"
          dpkg --compare-versions "$cur" gt 0.0.1~rc.1
      - name: .deb の更新インストール（同じ版の再導入 → 新しい版。ユーザーデータが残る）
        run: |
          set -e
          d="$RUNNER_TEMP/debs"; mkdir -p "$d"
          HARNESS_VERSION=0.0.1-rc.1 bash scripts/build-deb.sh "$d"
          HARNESS_VERSION=0.0.1 bash scripts/build-deb.sh "$d"
          old="$d/harness-app_0.0.1~rc.1_amd64.deb"; new="$d/harness-app_0.0.1_amd64.deb"
          # ユーザーデータ（アプリは XDG の設定ディレクトリに置く）の代わりのダミー
          data="${XDG_CONFIG_HOME:-$HOME/.config}/harness-app"
          mkdir -p "$data"; echo '{"formatVersion":1}' > "$data/config.json"
          sudo dpkg -i "$old"
          test "$(dpkg-query -W -f='${Version}' harness-app)" = "0.0.1~rc.1"
          sudo dpkg -i "$old"   # 同じ版の再導入
          test "$(dpkg-query -W -f='${Version}' harness-app)" = "0.0.1~rc.1"
          sudo dpkg -i "$new"   # 新しい版への更新
          test "$(dpkg-query -W -f='${Version}' harness-app)" = "0.0.1"
          test -x /usr/bin/harness-app
          test "$(cat "$data/config.json")" = '{"formatVersion":1}'
          sudo dpkg -r harness-app
          test -f "$data/config.json"   # アンインストールでもユーザーデータは消えない
          rm -rf "$data"

  dmg-smoke:
    name: dmg-smoke（make dmg）
    runs-on: macos-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci
      - name: make dmg（署名・公証なし）
        run: make dmg
      - name: 成果物の確認（universal バイナリと dmg）
        run: |
          ls -la build/bin
          file build/bin/harness-app.app/Contents/MacOS/harness-app
          hdiutil verify build/bin/harness-app.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: harness-app-dmg
          path: build/bin/harness-app.dmg
