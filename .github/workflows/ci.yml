name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  lint:
    name: lint（pre-commit・ルール検査）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install honnef.co/go/tools/cmd/staticcheck@latest
      - run: cd frontend && npm ci
      - run: pip install pre-commit
      - name: pre-commit（全ファイル）
        run: pre-commit run --all-files --show-diff-on-failure
      - name: 品質ゲート自体のテスト
        run: bash scripts/selftest-checks.sh

  test-go:
    name: test-go（race・カバレッジ基準）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - name: カバレッジ基準（collector・digest・masking・applier・runner が 70% 以上）
        run: bash scripts/coverage.sh

  test-frontend:
    name: test-frontend（build・カバレッジ基準）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci
      - run: cd frontend && npm run build
      - run: cd frontend && npm run test:coverage

  pr-policy:
    name: pr-policy（タイトル・issue 参照・CHANGELOG・テスト更新）
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: タイトルが Conventional 形式であること
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          re='^(feat|fix|refactor|test|docs|chore|ci)(\([a-zA-Z0-9_,./-]+\))?: .+'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "PR タイトルは '<feat|fix|refactor|test|docs|chore|ci>(scope)?: 要約' の形式にしてください: $TITLE"
            exit 1
          fi
      - name: 関連 issue の参照（Closes/Refs #N または [no-issue]）
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: bash scripts/check-pr-issue-link.sh
      - name: feat/fix は CHANGELOG を更新する
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE"
          bash scripts/check-changelog.sh "origin/$BASE"
      - name: 実装を変えたらテストも変える
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch origin "$BASE"
          bash scripts/check-tests-changed.sh range "origin/$BASE"

  test-macos:
    name: test-macos（darwin 上の Go テスト）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./... && go test -count=1 ./...

  test-windows:
    name: test-windows（Go テスト・フロントのビルドとテスト）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci && npm run build && npm test
      - run: go vet ./...
      - run: go test -count=1 ./...

  windows-build-smoke:
    name: windows-build-smoke（exe・インストーラ）
    runs-on: windows-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci
      - run: choco install nsis -y --no-progress
      - name: wails build（exe + NSIS インストーラ。署名なし）
        shell: bash   # 複数コマンドは bash で。pwsh は最後のコマンドの終了コードしか見ない
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -platform windows/amd64 -clean -nsis
          ls -la build/bin
      - uses: actions/upload-artifact@v4
        with:
          name: harness-app-windows
          path: build/bin/*installer.exe

  dmg-smoke:
    name: dmg-smoke（make dmg）
    runs-on: macos-latest
    needs: [test-go, test-frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - run: cd frontend && npm ci
      - name: make dmg（署名・公証なし）
        run: make dmg
      - name: 成果物の確認（universal バイナリと dmg）
        run: |
          ls -la build/bin
          file build/bin/harness-app.app/Contents/MacOS/harness-app
          hdiutil verify build/bin/harness-app.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: harness-app-dmg
          path: build/bin/harness-app.dmg
