name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  dmg:
    name: macOS（.dmg）
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: テスト
        run: cd frontend && npm ci && npm run build && npm test && cd .. && go vet ./... && go test ./...
      - name: .dmg をビルド（署名・公証なし）
        run: make dmg
      - name: Release に添付
        uses: softprops/action-gh-release@v2
        with:
          files: build/bin/harness-app.dmg
          generate_release_notes: true

  windows:
    name: Windows（zip・インストーラ）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI と NSIS
        shell: bash   # 複数コマンドは bash で。pwsh は最後のコマンドの終了コードしか見ない
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          choco install nsis -y --no-progress
      - name: テスト
        shell: bash
        run: |
          (cd frontend && npm ci && npm run build && npm test)
          go vet ./...
          go test -count=1 ./...
      - name: exe とインストーラをビルド（署名なし）
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -platform windows/amd64 -clean -nsis
          powershell -NoProfile -Command "Compress-Archive -Path build/bin/harness-app.exe -DestinationPath build/bin/harness-app-windows-amd64.zip"
          ls -la build/bin
      - name: Release に添付
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/bin/harness-app-windows-amd64.zip
            build/bin/*installer.exe
          generate_release_notes: true
