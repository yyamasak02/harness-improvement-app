name: Release
# 起動条件は 2 つ。
#   1. v* タグの push（scripts/release.sh tag X.Y.Z が案内。Release をワークフローが作成し、ノートは CHANGELOG から）
#   2. GitHub の Release 画面での公開（release: published。タグ名は v の有無どちらでもよい。既存の Release に成果物を添付し、ノートは上書きしない）
# 検証 → macOS / Windows / Linux（.deb）のビルド（成果物はアーティファクト）→ 公開（1 ジョブで成果物を添付）
# ワークフローが GITHUB_TOKEN で作った Release の公開イベントは、別のワークフローを起動しない（再起動の心配はない）。
# 外部由来の値（タグ名・Release の本文）は run: に直接埋め込まず、必ず env 経由で渡す。
on:
  push:
    tags: ['v*']
  release:
    types: [published]
permissions:
  contents: read

# 同じタグで 2 重に走らせない（push と Release 公開の両方が起きた場合は順に実行する）。
# Release 公開と tag push は同じタグ名になるので、タグ名で束ねる
# （GitHub Actions の式に substring 関数は無い。使うとワークフローごと無効になる）
concurrency:
  group: release-${{ github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  verify:
    name: タグとバージョン・CHANGELOG の整合を検証
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: タグ名を正規化する（v の有無を吸収。外部由来なので env 経由）
        id: tag
        env:
          RAW_TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          version="${RAW_TAG#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]] || { echo "タグ名が X.Y.Z / vX.Y.Z 形式ではありません"; exit 1; }
          echo "tag=$RAW_TAG" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_ENV"
      - name: check-version
        run: bash scripts/check-version.sh "v$version"
      - name: リリースノート（CHANGELOG の該当節）を作る
        run: |
          bash scripts/changelog-notes.sh "$version" > changes.md
          test -s changes.md || { echo "CHANGELOG の $version の節が空です"; exit 1; }
          bash scripts/release-guide.sh > release-notes.md
          cat changes.md >> release-notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  dmg:
    name: macOS（.dmg）
    needs: verify
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: テスト
        run: cd frontend && npm ci && npm run build && npm test && cd .. && go vet ./... && go test -count=1 ./...
      - name: .dmg をビルド（署名・公証なし）
        run: make dmg
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/bin/harness-app.dmg
          if-no-files-found: error

  windows:
    name: Windows（インストーラ）
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI と NSIS
        shell: bash   # 複数コマンドは bash で。pwsh は最後のコマンドの終了コードしか見ない
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
          choco install nsis -y --no-progress
      - name: テスト
        shell: bash
        run: |
          (cd frontend && npm ci && npm run build && npm test)
          go vet ./...
          go test -count=1 ./...
      - name: exe とインストーラをビルド（署名なし）
        shell: bash
        run: |
          export PATH="$PATH:/c/Program Files (x86)/NSIS"
          wails build -platform windows/amd64 -clean -nsis
          ls -la build/bin
      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: build/bin/*installer.exe
          if-no-files-found: error

  linux:
    name: Linux（.deb）
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Wails CLI と依存パッケージ
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libwebkit2gtk-4.1-dev
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.2
      - name: テスト
        run: |
          (cd frontend && npm ci && npm run build && npm test)
          go vet ./...
          go test -count=1 ./...
      - name: Linux 用バイナリと .deb をビルド（署名なし）
        run: |
          make linux
          bash scripts/build-deb.sh build/bin
          dpkg-deb --info build/bin/harness-app_*_amd64.deb
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: build/bin/harness-app_*_amd64.deb
          if-no-files-found: error

  publish:
    name: Release を作成して成果物を添付
    needs: [verify, dmg, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 成果物の確認
        run: |
          find artifacts -type f | sort
          test -f artifacts/dist-macos/harness-app.dmg
          ls artifacts/dist-windows/*installer.exe
          ls artifacts/dist-linux/harness-app_*_amd64.deb
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          # push 起動のときだけノートを設定する。Release 画面から作った Release の本文は上書きしない
          body_path: ${{ github.event_name == 'push' && 'artifacts/release-notes/release-notes.md' || '' }}
          # push 起動のときだけ pre-release を判定する（release 起動では人が選んだ値を変えない）
          prerelease: ${{ github.event_name == 'push' && contains(github.ref_name, '-') || github.event.release.prerelease }}
          files: |
            artifacts/dist-macos/harness-app.dmg
            artifacts/dist-windows/*installer.exe
            artifacts/dist-linux/harness-app_*_amd64.deb
      # 再実行（Re-run）で成功したとき、前回の失敗で付いた警告をノートから取り除く（Release 画面起動のみ）
      - name: 前回の失敗の警告をノートから取り除く
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > body.md
          if grep -q 'release-build-failed' body.md; then
            awk '/release-build-failed/{skip=1; next} skip&&/^$/{skip=0; next} {skip=0; print}' body.md > notes.md
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
          fi

  notify-failure:
    name: 失敗を Release のノートに表示
    # Release 画面から作った場合のみ（push 起動では Release がまだ無い。Actions の失敗表示を見る）
    if: failure() && github.event_name == 'release'
    needs: [verify, dmg, windows, linux, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: ノートの先頭に警告を付ける
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          # 再実行で失敗が続いても警告を重複して積まない
          if printf '%s' "$body" | grep -q 'release-build-failed'; then exit 0; fi
          printf '> **インストーラのビルドに失敗しました。** この Release にインストーラは添付されていません。詳細: %s <!-- release-build-failed -->\n\n%s\n' "$RUN_URL" "$body" > notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
