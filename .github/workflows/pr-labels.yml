name: PR labels
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
permissions:
  contents: read
  pull-requests: write
jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        continue-on-error: true   # フォークからの PR では権限が無い
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false
      - name: タイトルの prefix から type ラベルを付ける
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ github.event.pull_request.title }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          case "$TITLE" in
            feat*) l=type/feature ;;
            fix*) l=type/bug ;;
            refactor*) l=type/tech-debt ;;
            test*) l=type/test ;;
            docs*) l=type/docs ;;
            chore*|ci*) l=type/chore ;;
            *) exit 0 ;;
          esac
          gh pr edit "$PR" --repo "$REPO" --add-label "$l"
